name: soporte_php
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Ejecute scripts/install.ps1 o scripts/install.sh}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${POSTGRES_HOST_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 30
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${MONGO_HOST_PORT:-27019}:27017'
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok"']
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    # La aplicación y los proyectos de prueba reutilizan una sola imagen.
    image: soporte_php-web:latest
    build: ./app
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8081}:80'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: soporte_web
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      MONGO_HOST: mongodb
      MONGO_DB: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
volumes:
  postgres_data:
  mongo_data:
